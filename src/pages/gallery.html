<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery - Mario</title>
  <link rel="stylesheet" href="/src/styles/retro.css">
  <link rel="icon" href="https://i.imgur.com/KwX2CTv.gif">
</head>
<body>

  <div id="header-placeholder"></div>

  <div class="header">
    <h1>GIF GALLERY</h1>
    <p>A few pictures</p>
  </div>

  <div class="main-layout">
    <div class="content">
      <!--
        To add more photos: drop the image into public/images/gallery/ and copy one of the
        figure blocks below, pointing src at the new file.
      -->
      <div class="gallery-grid">
        <figure class="gallery-item">
          <img src="/public/images/profile-pic.png" alt="Mario Barros">
          <figcaption>That's me</figcaption>
        </figure>

        <figure class="gallery-item">
          <img src="/public/images/linux_mascot_tux.png" alt="Tux the Linux mascot">
          <figcaption>My co-pilot</figcaption>
        </figure>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="/src/utils/load-components.js"></script>
  <script src="/src/utils/script.js"></script>
</body>
</html>
